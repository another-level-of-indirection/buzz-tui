name: CI

on:
  push:
    branches: [hybrid-monorepo, main]
  pull_request:
    branches: [hybrid-monorepo, main]

jobs:
  rust-check:
    name: cargo check (buzz-session)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps (keyring → dbus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo check -p buzz-session
